<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DockBound — Demo Script</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    color: #1f2937;
    background: #fff;
  }
  .cover {
    background: linear-gradient(135deg, #1e0a4a 0%, #3b0f8c 60%, #0d9488 100%);
    color: #fff;
    padding: 3rem 2.5rem 2.5rem;
  }
  .cover .logo-mark {
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: -0.02em;
    color: #fff;
    margin-bottom: 0.25rem;
  }
  .cover .logo-mark span { color: #c9920b; }
  .cover h1 {
    font-size: 1.5rem;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    margin-bottom: 0.5rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .cover .meta {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.5);
  }
  .cover .meta span { margin-right: 1.5rem; }
  .content { max-width: 960px; margin: 0 auto; padding: 2rem 2.5rem; }
  .placeholder {
    margin-top: 2rem;
    padding: 2rem;
    background: #f5f3ff;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    color: #6b7280;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="cover">
  <div class="logo-mark">Dock<span>Bound</span></div>
  <h1>Demo Script</h1>
  <div class="meta">
    <span>PandA Ventures Group</span>
    <span>Draft</span>
  </div>
</div>

<div class="content">
  <div class="placeholder">
    Document in progress. Content to be added.
  </div>
</div>

</body>
</html>
